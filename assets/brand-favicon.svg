<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Store">
  <!-- Neutral default mark: ink ground, paper aperture. Names nothing, so it is
       safe on any store until the merchant uploads a square logo (Theme settings
       → Brand & SEO). Solid shapes only — a 16px favicon loses hairlines. -->
  <rect width="32" height="32" rx="7" fill="#141310"/>
  <circle cx="16" cy="16" r="7" fill="#FAF8F4"/>
</svg>
